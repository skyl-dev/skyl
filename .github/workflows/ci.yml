name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format and rule shape
        run: ./scripts/validate.py skills

      - name: No evaluation language in installable sections
        run: |
          shopt -s nullglob
          files=(skills/*/*/SKILL.md)
          if [ ${#files[@]} -eq 0 ]; then echo "no skills yet"; exit 0; fi
          bash scripts/leakcheck.sh "${files[@]}"

      - name: Cross-skill references resolve
        run: |
          for family in skills/*/; do
            [ -d "$family" ] || continue
            ./scripts/xrefcheck.py "$family"
          done

      - name: Index is present and current
        run: |
          if [ ! -f index.json ]; then
            echo "::error::index.json is missing. It is the resolvable form of skills/ and must be committed."
            echo "Run: ./scripts/build-index.py > index.json"
            exit 1
          fi
          ./scripts/build-index.py > /tmp/index.json
          if ! diff -u index.json /tmp/index.json; then
            echo "::error::index.json does not match skills/. Regenerate and commit it."
            echo "Run: ./scripts/build-index.py > index.json"
            exit 1
          fi
          echo "index.json matches skills/"

      - name: Ledger covers every rule
        run: |
          for family in evidence/*/; do
            [ -d "$family" ] || continue
            name=$(basename "$family")
            [ -d "skills/$name" ] || continue
            ./scripts/build-ledger.py "$name" > /tmp/rules.md
            if ! diff -u "$family/rules.md" /tmp/rules.md; then
              echo "::error::evidence/$name/rules.md does not match. Regenerate and commit it."
              echo "Run: ./scripts/build-ledger.py $name > evidence/$name/rules.md"
              exit 1
            fi
          done
